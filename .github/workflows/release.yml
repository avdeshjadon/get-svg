name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          PREFIX="get-svg-$TARGET"
          ARTIFACT="get-svg-$TARGET.$ARCHIVE"
          mkdir -p "dist/$PREFIX"
          cp "target/$TARGET/release/get-svg$EXT" "dist/$PREFIX/"
          cp "target/$TARGET/release/getsvg$EXT" "dist/$PREFIX/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$PREFIX/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "$ARTIFACT" "$PREFIX"
          else
            tar -czf "$ARTIFACT" "$PREFIX"
          fi

      - name: Upload binary checksum
        shell: bash
        env:
          ARTIFACT: get-svg-${{ matrix.target }}.${{ matrix.archive }}
        run: |
          set -euo pipefail
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          else
            openssl dgst -sha256 "$ARTIFACT" | awk '{print $2}' > "$ARTIFACT.sha256"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/get-svg-${{ matrix.target }}.${{ matrix.archive }}
            dist/get-svg-${{ matrix.target }}.${{ matrix.archive }}.sha256
          generate_release_notes: true